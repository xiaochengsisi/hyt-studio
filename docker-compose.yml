services:
  hyt:
    # 本地构建：build: .
    # 拉取镜像：取消下面 image: 注释并删除 build 段
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/<owner>/hyt-studio:latest
    container_name: hyt-studio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/hyt.db
    volumes:
      # SQLite 数据库（持久化，避免容器重建后丢失）
      - ./data:/app/data
      # 上传的图片等静态资源
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
